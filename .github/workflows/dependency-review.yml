name: Dependency Review
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/dependency-review-action@5a2c0e3b3a530a7e5b17a9a1e32f2dc1b5d55b8c # v4.5.0
        with:
          fail-on-severity: high
